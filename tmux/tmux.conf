# ============================================================================
#  ~/.tmux.conf — sebax @ UNCUYO
#  Repo: https://github.com/sebavargasgodoy/dotfiles
# ============================================================================

# ─── PREFIX & TERMINAL ──────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g default-terminal "screen-256color"
# tmux 3.2+ : terminal-features (color verdadero por terminal)
%if #{>=:#{version},3.2}
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-features ",alacritty:RGB"
%endif
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# ─── COMPORTAMIENTO GENERAL ─────────────────────────────────────────────────
set -g mouse on
set -g history-limit 100000
set -sg escape-time 0
set -g focus-events on
# allow-passthrough requiere tmux >= 3.3 (no existe en 3.2 de Ubuntu 22.04)
if-shell -b '[ "$(tmux -V | sed "s/[^0-9.]//g" | awk -F. "{ printf \"%d%02d\", \$1, \$2 }")" -ge 303 ]' \
  "set -g allow-passthrough on"
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
setw -g automatic-rename on
setw -g automatic-rename-format "#W"

# ─── SPLITS ─────────────────────────────────────────────────────────────────
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ─── NAVEGACIÓN ENTRE PANES (vim-style) ─────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -r m resize-pane -Z
bind S setw synchronize-panes \; display "Sync: #{?pane_synchronized,ON,OFF}"

# ─── COPY MODE (vi-style) ───────────────────────────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel
# ─── Botón derecho pega el buffer (en vez de abrir menú contextual) ──────────
unbind -n MouseDown3Pane

bind -n MouseDown3Pane run-shell 'if [ -n "$DISPLAY" ] && command -v xclip >/dev/null; then tmux set-buffer -- "$(xclip -o -selection clipboard)"; fi; tmux paste-buffer'

set -g set-clipboard on

# ─── RECARGA DE CONFIG ──────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display-message "  Config recargada"

# ─── STATUS BAR ─────────────────────────────────────────────────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#0d0d0d,fg=#888888"

set -g status-left-length 40
set -g status-left "#[fg=#ff9e64,bg=#0d0d0d,bold]#S  "

set -g status-right-length 80
set -g status-right "#[fg=yellow]#(whoami)@#H #[fg=cyan]│ %d-%b %H:%M "

setw -g window-status-format         "#[fg=#555555,bg=#0d0d0d] #I:#W "
setw -g window-status-current-format "#[fg=#0d0d0d,bg=#7dcfff,bold] #I:#W #[default]"
setw -g window-status-separator      ""

set -g pane-border-style        "fg=#444444"
set -g pane-active-border-style "fg=green"

set -g message-style "bg=green,fg=black,bold"

# ─── SESSION SWITCHER (fzf) ─────────────────────────────────────────────────
# tmux 3.2+ : sessionizer requiere display-popup
%if #{>=:#{version},3.2}
bind C-j display-popup -E -w 60% -h 40% "~/bin/tmux-sessionizer"
%endif

# ─── PLUGINS (TPM) ──────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.tmux/plugins/tpm/tpm'
